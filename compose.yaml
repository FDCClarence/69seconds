services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: sixtynine_seconds_dev
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pmysql --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
